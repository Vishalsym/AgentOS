[project]
name = "sentari"
version = "0.1.0"
description = "An OS-inspired kernel for scheduling, isolation, and deadlock detection in multi-agent AI systems"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vishal Sharma" }]
dependencies = ["anthropic>=0.40.0", "rich>=13.9"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115", "uvicorn>=0.32"]
langgraph = ["langgraph>=0.2"]
mcp = ["mcp>=2.0", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentari"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
